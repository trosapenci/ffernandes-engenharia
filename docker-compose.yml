version: "3.9"

services:
  ffernandes-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ffernandes-engenharia-web
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - HOST=0.0.0.0
    volumes:
      - ffernandes_sqlite_data:/app/backend
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  ffernandes_sqlite_data:
    driver: local
